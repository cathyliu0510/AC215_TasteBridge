# Connected app with the bundled toy catalogue by default.
# Add compose.integration.real.yml to mount an existing trained-model export.
# TASTEBRIDGE_BACKEND_DIR can select a separate backend checkout for review.
name: tastebridge-preview
services:
  backend:
    build:
      context: ${TASTEBRIDGE_BACKEND_DIR:-./src/backend}
    environment:
      ARTIFACT_DIR: /app/sample_artifacts
      CORS_ORIGINS: "http://localhost:${TASTEBRIDGE_UI_PORT:-4176},http://127.0.0.1:${TASTEBRIDGE_UI_PORT:-4176}"
    volumes:
      - feedback:/app/feedback
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9000/health')"]
      interval: 5s
      timeout: 3s
      retries: 12
  frontend:
    build: ./frontend/prototype
    init: true
    ports:
      - "127.0.0.1:${TASTEBRIDGE_UI_PORT:-4176}:8080"
    environment:
      API_BASE_URL: http://backend:9000
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
volumes:
  feedback:
